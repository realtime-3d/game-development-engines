<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Engine Finder — Game Development Engines</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Game Engine Finder</h1>
      <p>Filter 25 commercial and open-source game development engines by 2D/3D, target platforms, language, license, and pricing.</p>
    </header>

    <section class="controls" aria-label="Engine filters">
      <div class="control-group">
        <label for="search">Search</label>
        <input id="search" type="text" placeholder="e.g. Godot, pixel art, Rust, mobile..." />
      </div>

      <div class="control-group">
        <label for="dimension">Dimensions</label>
        <select id="dimension">
          <option value="all">2D or 3D</option>
          <option value="2d">2D</option>
          <option value="3d">3D</option>
        </select>
      </div>

      <div class="control-group">
        <label for="platform">Target Platform</label>
        <select id="platform">
          <option value="all">Any Platform</option>
          <option value="Windows">Windows</option>
          <option value="macOS">macOS</option>
          <option value="Linux">Linux</option>
          <option value="Android">Android</option>
          <option value="iOS">iOS</option>
          <option value="Web">Web (HTML5/Wasm)</option>
          <option value="Consoles">Consoles</option>
        </select>
      </div>

      <div class="control-group">
        <label for="language">Language</label>
        <select id="language">
          <option value="all">Any Language</option>
        </select>
      </div>

      <div class="control-group">
        <label for="skill">Experience Level</label>
        <select id="skill">
          <option value="all">Any Level</option>
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>

      <div class="toggles">
        <label class="toggle"><input id="freeOnly" type="checkbox" /> Free tier available</label>
        <label class="toggle"><input id="zeroRoyaltyOnly" type="checkbox" /> 0% Royalties</label>
        <label class="toggle"><input id="openSourceOnly" type="checkbox" /> Open Source</label>
        <label class="toggle"><input id="noCodeOnly" type="checkbox" /> No-Code / Visual friendly</label>
      </div>
    </section>

    <div class="results-bar">
      <span id="count">Loading engines...</span>
      <button id="reset" class="reset-btn" type="button">Reset Filters</button>
    </div>

    <section id="grid" class="grid" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
